name: Build

# Every push produces installable artifacts. There is no GitHub Release:
# download the APK and MSI from the run's artifacts, the same way kartka and
# tx-one-control publish ordinary builds.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: test and apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test and assemble debug APK
        run: gradle :composeApp:desktopTest :androidApp:assembleDebug --stacktrace -Pvinyl.versionCode=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          apk=$(echo androidApp/build/outputs/apk/debug/*.apk)
          aapt=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt -type f | sort | tail -1)
          badging=$("$aapt" dump badging "$apk")
          version_name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          version_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          named="vinyl-scrobbler-${version_name}-${version_code}.apk"
          cp "$apk" "$named"
          echo "file=$named" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Debug APK"
            echo "Download \`${{ steps.apk.outputs.file }}\`. It is the APK itself, not a zip."
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: windows msi
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $yes = ("y`n" * 200)
          $yes | sdkmanager --licenses | Out-Null
          sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Compose downloads WiX 3 itself while packaging the MSI.
      - name: Package Windows MSI
        run: gradle :composeApp:packageReleaseMsi --stacktrace

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: composeApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Windows MSI"
            echo "Download **windows-msi** from the artifacts on this run."
          } >> "$GITHUB_STEP_SUMMARY"
        shell: pwsh
